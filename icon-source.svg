<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="syringe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Brilho sutil no topo -->
  <ellipse cx="256" cy="120" rx="220" ry="70" fill="white" opacity="0.08"/>
  <!-- Seringa estilizada (rotacionada -45deg em torno do centro) -->
  <g transform="translate(256 256) rotate(-45) translate(-256 -256)">
    <!-- Êmbolo (parte de cima da seringa) -->
    <rect x="100" y="170" width="56" height="40" rx="6" fill="url(#syringe)"/>
    <rect x="118" y="135" width="20" height="40" fill="url(#syringe)"/>
    <!-- Corpo (cilindro principal) -->
    <rect x="156" y="180" width="200" height="80" rx="6" fill="url(#syringe)" stroke="#1e40af" stroke-width="4"/>
    <!-- Marcações de medida -->
    <line x1="190" y1="200" x2="190" y2="240" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>
    <line x1="220" y1="200" x2="220" y2="240" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>
    <line x1="250" y1="200" x2="250" y2="240" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>
    <line x1="280" y1="200" x2="280" y2="240" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>
    <line x1="310" y1="200" x2="310" y2="240" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>
    <!-- Líquido azul dentro da seringa -->
    <rect x="160" y="200" width="120" height="40" fill="#3b82f6" opacity="0.85"/>
    <!-- Bico cônico -->
    <polygon points="356,210 356,230 376,224 376,216" fill="url(#syringe)" stroke="#1e40af" stroke-width="4"/>
    <!-- Agulha -->
    <rect x="376" y="218" width="60" height="4" rx="2" fill="#94a3b8"/>
    <!-- Gota saindo da agulha -->
    <circle cx="448" cy="220" r="6" fill="#60a5fa" opacity="0.9"/>
  </g>
</svg>
